---
layout: default
---

<article class="post">
  <header class="post-header">
    <p class="eyebrow">{{ page.category | default: "RESEARCH" }}</p>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time>
      {% if page.tags %}<span>•</span><span>{{ page.tags | join: " · " }}</span>{% endif %}
    </div>
  </header>

  <div class="post-content">{{ content }}</div>

  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}">← Return to archive</a>
  </footer>
</article>
